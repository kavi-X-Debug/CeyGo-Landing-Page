name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Smoke test API and built site
        env:
          NODE_ENV: production
          PORT: 4000
        run: |
          node server/app.js &
          for i in $(seq 1 15); do
            curl -fsS http://localhost:4000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:4000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:4000/ | grep -q '<div id="root"'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:4000/api/nope | grep -q 404
